name: Validate content

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.0.0
      - name: Manifests are up to date
        run: |
          python tools/check_manifests_fresh.py
      - name: Validate manifests, media and WhatsApp limits
        run: python tools/validate.py

  check-live:
    # After a push to main, confirm both mirrors the app uses serve the new index.
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Published index matches this commit
        run: |
          want=$(python3 -c "import json; print(json.load(open('v1/index.json'))['contentVersion'])")
          for base in "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/" "https://github.com/${GITHUB_REPOSITORY}/raw/${GITHUB_SHA}/"; do
            got=$(curl -fsSL "${base}v1/index.json" | python3 -c "import json,sys; print(json.load(sys.stdin)['contentVersion'])")
            echo "$base -> $got"; test "$got" = "$want"
          done
